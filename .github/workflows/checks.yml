name: Checks
on: [push, pull_request]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: for file in *.js; do node --check "$file"; done
      - run: bash -n build.sh
      - run: node -e "const m=require('./manifest.json'); if(m.name !== 'Cyphr') process.exit(1)"
